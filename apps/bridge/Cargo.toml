[package]
name = "omp-bridge"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Authenticated loopback HTTP/WebSocket bridge for the OMP RPC process"

[lib]
name = "omp_bridge"
path = "src/lib.rs"

[[bin]]
name = "omp-bridge"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
getrandom = "0.3"
libc = "0.2"
omp-rpc = { path = "../../crates/omp-rpc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "process",
  "io-util",
  "sync",
  "time",
  "net",
  "signal",
] }
tokio-util = { version = "0.7", features = ["codec"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
tokio-tungstenite = "0.28"
tower = { version = "0.5", features = ["util"] }
