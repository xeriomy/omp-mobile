[package]
name = "omp-client"
version = "0.1.0"
description = "OMP Client mobile shell"
edition = "2024"
publish = false

[lib]
name = "omp_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
